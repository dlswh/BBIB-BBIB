global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus runs with host network on Linux Docker.
  # Therefore 127.0.0.1:9100 points to the EC2 host Node Exporter.
  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          instance: ec2-linux
