name: s14p31s207-backend

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/backend/Dockerfile
    image: s14p31s207-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: s207-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:-}
      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-dev}
      SPRING_SECURITY_USER_NAME: ${BACKEND_BASIC_AUTH_USER:-s207-admin}
      SPRING_SECURITY_USER_PASSWORD: ${BACKEND_BASIC_AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://s207-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: s207-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${BACKEND_KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${BACKEND_KAFKA_CONSUMER_GROUP_ID:-backend-consumer}
      MINIO_ENDPOINT: http://s207-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/actuator/health | grep '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - s207-app

networks:
  s207-app:
    external: true
    name: s207-app
