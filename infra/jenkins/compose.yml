services:
  jenkins:
    build:
      context: /home/ubuntu/ops/jenkins
      dockerfile: Dockerfile
    user: root
    image: s14p31s207-jenkins:lts-docker
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Duser.timezone=Asia/Seoul"
    volumes:
      - /home/ubuntu/ops/jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
