name: s14p31s207-frontend

services:
  frontend:
    build:
      context: ../..
      dockerfile: infra/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-https://k14s207.p.ssafy.io}
        VITE_USE_MOCK: ${FRONTEND_USE_MOCK:-true}
    image: s14p31s207-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: s207-frontend
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${FRONTEND_PORT:-3001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s207-frontend

networks:
  s207-frontend:
    name: s207-frontend
